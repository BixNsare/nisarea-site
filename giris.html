
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f1ff">
<title>Giriş / Kayıt | NİSAREA</title>
<style>
:root{--purple:#7962ef;--ink:#4f4c82;--muted:#8989bb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f7f5ff,#edf7ff);color:var(--ink);font-family:"Trebuchet MS",Arial,sans-serif}
header{margin:16px auto;width:calc(100% - 32px);max-width:1200px;padding:16px 22px;background:#ffffffdc;border:1px solid white;border-radius:17px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.brand{font-size:32px;font-weight:900;font-style:italic;color:#8b79f6;text-decoration:none}
nav{display:flex;gap:15px;flex-wrap:wrap}
nav a{font-size:13px;font-weight:bold;color:#6559cf;text-decoration:none}
main{width:min(520px,calc(100% - 28px));margin:55px auto}
.panel{padding:clamp(22px,5vw,40px);background:#ffffffc9;border:1px solid white;border-radius:24px;box-shadow:0 14px 40px #91b7e51c}
.kicker{font-size:11px;letter-spacing:3px;color:#9786f7;font-weight:bold}
h1{font-size:clamp(30px,7vw,43px);font-style:italic;color:#8270f4;margin:15px 0}
p{color:var(--muted);line-height:1.7}
.tabs{display:flex;gap:10px;margin:22px 0}
button{font:inherit;cursor:pointer}
.btn{display:inline-block;border:0;border-radius:30px;padding:13px 20px;font-weight:bold;background:linear-gradient(110deg,#9b83ff,#7660ed);color:white}
.btn.secondary{background:white;border:1px solid #d9d5ff;color:#7a68e6}
label{display:block;margin:17px 0 7px;color:#6559cf;font-weight:bold}
input{width:100%;padding:13px 15px;border:1px solid #dbe8fa;border-radius:12px;background:white;font:inherit;color:var(--ink)}
.submit{width:100%;margin-top:22px}
.notice{padding:12px;border-radius:12px;background:#eff5ff;font-size:13px;overflow-wrap:anywhere}
[hidden]{display:none!important}
.back{display:inline-block;margin-top:20px;color:#7566df;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<header>
<a class="brand" href="index.html">NİSAREA</a>
<nav>
<a href="index.html">Anasayfa</a>
<a href="magaza.html">Mağaza</a>
<a href="destek.html">Destek</a>
</nav>
</header>

<main>
<section class="panel">
<div class="kicker">✦ NİSAREA NETWORK</div>
<h1>Hesabına hoş geldin</h1>
<p>Giriş yapabilir veya yeni bir NİSAREA hesabı oluşturabilirsin.</p>

<div class="tabs">
<button class="btn" id="login-tab" type="button">Giriş yap</button>
<button class="btn secondary" id="register-tab" type="button">Kayıt ol</button>
</div>

<form id="auth-form">
<div id="username-field">
<label for="username">Kullanıcı adı</label>
<input id="username" type="text" minlength="3" maxlength="16" autocomplete="username" placeholder="Oyuncu adın">
</div>

<label for="email">E-posta</label>
<input id="email" type="email" required autocomplete="email" placeholder="ornek@eposta.com">

<label for="password">Şifre</label>
<input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="En az 6 karakter">

<button class="btn submit" id="submit-button" type="submit">Giriş yap</button>
</form>

<p class="notice" id="message" aria-live="polite">Kayıt olmak için üstteki Kayıt ol düğmesine bas.</p>
<a class="back" href="index.html">← Anasayfaya dön</a>
</section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  updateProfile,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYRIAEnqFE89HpMOWgaJSFkgrWlMqiJzc",
  authDomain: "nisarea.firebaseapp.com",
  projectId: "nisarea",
  storageBucket: "nisarea.firebasestorage.app",
  messagingSenderId: "208467596749",
  appId: "1:208467596749:web:9aea861c6327c95a3b6084",
  measurementId: "G-WS4VR318LY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("auth-form");
const usernameField = document.getElementById("username-field");
const usernameInput = document.getElementById("username");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const message = document.getElementById("message");
const submitButton = document.getElementById("submit-button");
const loginTab = document.getElementById("login-tab");
const registerTab = document.getElementById("register-tab");

let mode = "login";

function setMode(nextMode) {
  mode = nextMode;
  const registering = mode === "register";

  usernameField.hidden = !registering;
  usernameInput.required = registering;
  passwordInput.autocomplete = registering ? "new-password" : "current-password";

  submitButton.textContent = registering ? "Kayıt ol" : "Giriş yap";
  loginTab.className = registering ? "btn secondary" : "btn";
  registerTab.className = registering ? "btn" : "btn secondary";
  message.textContent = registering
    ? "Kullanıcı adını 3-16 karakter arasında belirle."
    : "E-posta adresin ve şifrenle giriş yap.";
}

loginTab.addEventListener("click", () => setMode("login"));
registerTab.addEventListener("click", () => setMode("register"));

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  submitButton.disabled = true;

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  try {
    if (mode === "register") {
      const username = usernameInput.value.trim();

      if (!/^[a-zA-Z0-9_]{3,16}$/.test(username)) {
        throw new Error("Kullanıcı adı 3-16 karakter olmalı. Harf, rakam ve _ kullanabilirsin.");
      }

      const result = await createUserWithEmailAndPassword(auth, email, password);

      await updateProfile(result.user, { displayName: username });

      message.textContent = "Kayıt başarılı! Ana sayfaya yönlendiriliyorsun.";
      setTimeout(() => location.href = "index.html", 900);
    } else {
      await signInWithEmailAndPassword(auth, email, password);
      message.textContent = "Giriş başarılı! Ana sayfaya yönlendiriliyorsun.";
      setTimeout(() => location.href = "index.html", 900);
    }
  } catch (error) {
    const errors = {
      "auth/email-already-in-use": "Bu e-posta zaten kayıtlı. Giriş yapmayı dene.",
      "auth/invalid-email": "E-posta adresini kontrol et.",
      "auth/weak-password": "Şifren en az 6 karakter olmalı.",
      "auth/invalid-credential": "E-posta veya şifre hatalı.",
      "auth/network-request-failed": "İnternet bağlantını kontrol et."
    };

    message.textContent = errors[error.code] || error.message || "Bir hata oluştu.";
  } finally {
    submitButton.disabled = false;
  }
});

onAuthStateChanged(auth, (user) => {
  if (user) {
    message.textContent = "Oturum açık: " + (user.displayName || user.email);
    const logout = document.getElementById("logout-button");
    if (logout) logout.hidden = false;
  }
});

const logoutButton = document.createElement("button");
logoutButton.id = "logout-button";
logoutButton.className = "btn secondary";
logoutButton.textContent = "Çıkış yap";
logoutButton.hidden = true;
logoutButton.addEventListener("click", async () => {
  await signOut(auth);
  location.reload();
});
document.querySelector(".panel").appendChild(logoutButton);
</script>
</body>
</html>
